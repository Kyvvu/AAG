<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AAG mark">
  <!-- The agent's action path: a source, a gate on the path, a branch chosen at run time. -->
  <g stroke="#6366f1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 47 L31 31" />
    <path d="M31 31 L50 16" />
    <path d="M31 31 L50 48" />
    <!-- gate on the path -->
    <rect x="24.5" y="24.5" width="13" height="13" rx="1.6" transform="rotate(45 31 31)" fill="none" />
  </g>
  <g fill="#6366f1">
    <!-- source node -->
    <circle cx="14" cy="47" r="5.4" />
    <!-- branch endpoint -->
    <circle cx="50" cy="48" r="4.4" />
  </g>
  <!-- intended / open endpoint (ring) -->
  <circle cx="50" cy="16" r="5" fill="none" stroke="#6366f1" stroke-width="3.2" />
</svg>
