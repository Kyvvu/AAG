name: AAG CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff (lint + import order)
        run: ruff check .
      - name: mypy (strict)
        run: mypy spec validator tests
      - name: spec is up to date (vocabulary.json + action.schema.json)
        run: python spec/generate.py --check
      - name: pytest
        run: pytest -q
